<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blubber Blasen</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #ddd;
    font-family: system-ui, sans-serif;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* the game draws 256 x 224 scaled by 3; CSS scales it further to fit, keeping the pixels sharp */
  canvas {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    aspect-ratio: 256 / 224;
    width: min(100vw, calc(100vh * 256 / 224));
    height: auto;
    image-rendering: pixelated;
    outline: none;
  }
  #start {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(0, 0, 0, 0.75);
    cursor: pointer;
    text-align: center;
  }
  #start h1 { margin: 0; font-size: 32px; color: #ffe066; letter-spacing: 2px; }
  #start p { margin: 0; font-size: 15px; line-height: 1.6; }
  #status { color: #aaa; }
  kbd {
    display: inline-block;
    padding: 0 6px;
    border: 1px solid #666;
    border-radius: 4px;
    background: #222;
    font-family: inherit;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></div>
<div id="start">
  <h1>BLUBBER BLASEN</h1>
  <p id="status">Loading …</p>
  <p>Player 1: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · <kbd>K</kbd> jump · <kbd>J</kbd> bubble · <kbd>L</kbd> dash · <kbd>Enter</kbd> start<br>
     Player 2: arrow keys · <kbd>.</kbd> jump · <kbd>,</kbd> bubble · <kbd>/</kbd> dash · <kbd>Right Ctrl</kbd> start<br>
     <kbd>Right Shift</kbd> on the title screen: options · gamepads work too</p>
</div>
<script>
  var startLayer = document.getElementById('start');
  var statusLine = document.getElementById('status');
  var canvas = document.getElementById('canvas');

  var Module = {
    canvas: canvas,
    print: function (text) { console.log(text); },
    printErr: function (text) { console.warn(text); },
    setStatus: function (text) {
      statusLine.textContent = text ? text : 'Click to start';
    },
    monitorRunDependencies: function (left) {
      if (left === 0) {
        statusLine.textContent = 'Click to start';
      }
    }
  };

  /* Browsers only allow sound and keyboard focus after a click.
     For automated checks, #nostart in the address skips this layer
     (and lets a plain timer run the game, see platform_raylib.c). */
  if (location.hash === '#nostart') {
    startLayer.style.display = 'none';
  }
  /* The game opens its audio device after the first click or key press
     (Module.bbActivated); browsers keep earlier audio silent. */
  function activate() {
    Module.bbActivated = true;
  }
  startLayer.addEventListener('click', function () {
    startLayer.style.display = 'none';
    canvas.focus();
  });
  window.addEventListener('pointerdown', activate, true);
  window.addEventListener('keydown', activate, true);
  window.addEventListener('keydown', function (e) {
    /* keep the arrow keys and space from scrolling the page */
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(e.key) >= 0) {
      e.preventDefault();
    }
  });
</script>
{{{ SCRIPT }}}
</body>
</html>
